name: CI

on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]

jobs:
  # ── Stage 1: Unit tests — no API keys needed ──────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          OPENAI_API_KEY: "sk-dummy"
          GROQ_API_KEY: "gsk-dummy"
          DEEPGRAM_API_KEY: "dg-dummy"
          ELEVENLABS_API_KEY: "el-dummy"
          TWILIO_ACCOUNT_SID: "ACdummy"
          TWILIO_AUTH_TOKEN: "dummy"
        run: python tests/test_utils.py

  # ── Stage 2: Intent & slot evals — needs LLM API key ─────────────────────
  eval-tests:
    name: Eval Tests (Intent + Slot)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run slot eval
        env:
          OPENAI_API_KEY: "sk-dummy"
          GROQ_API_KEY: "gsk-dummy"
          DEEPGRAM_API_KEY: "dg-dummy"
          ELEVENLABS_API_KEY: "el-dummy"
          TWILIO_ACCOUNT_SID: "ACdummy"
          TWILIO_AUTH_TOKEN: "dummy"
        run: python tests/eval_slots.py

      - name: Run intent eval
        env:
          LLM_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: "sk-dummy"
          DEEPGRAM_API_KEY: "dg-dummy"
          ELEVENLABS_API_KEY: "el-dummy"
          TWILIO_ACCOUNT_SID: "ACdummy"
          TWILIO_AUTH_TOKEN: "dummy"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: "ci"
          ENABLE_RAG: "false"
        run: python tests/eval_intents.py

  # ── Stage 3: E2E Twilio call test — master only ───────────────────────────
  e2e-tests:
    name: E2E Twilio Tests
    runs-on: ubuntu-latest
    needs: eval-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run E2E Twilio test
        env:
          LLM_PROVIDER: "groq"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_BASE_URL: ${{ secrets.TWILIO_BASE_URL }}
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          REDIS_URL: "redis://localhost:6379/0"
          ENVIRONMENT: "ci"
          ENABLE_RAG: "false"
        run: python tests/eval_e2e_twilio.py
