name: Deploy

on:
  push:
    branches: [master]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

env:
  AWS_REGION: us-east-1
  ECR_REPO: ivr-app

jobs:
  # ── Build and push Docker image to ECR ─────────────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_image: ${{ steps.meta.outputs.ecr_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_TAG="sha-$(git rev-parse --short HEAD)"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}"
          docker build -t "${ECR_IMAGE}" .
          docker tag "${ECR_IMAGE}" "${ECR_REGISTRY}/${ECR_REPO}:latest"
          docker push "${ECR_IMAGE}"
          docker push "${ECR_REGISTRY}/${ECR_REPO}:latest"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${ECR_IMAGE}" >> "$GITHUB_OUTPUT"

  # ── Deploy to Dev ──────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (dev)
        run: |
          aws ecs update-service \
            --cluster ivr-cluster \
            --service dev-ivr-svc \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for dev service stable
        run: |
          aws ecs wait services-stable \
            --cluster ivr-cluster \
            --services dev-ivr-svc \
            --region ${{ env.AWS_REGION }}

      - name: Health check (dev)
        run: |
          DEV_URL="${{ secrets.DEV_ALB_URL }}"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${DEV_URL}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Dev healthy after $((i * 5))s"
              exit 0
            fi
            echo "  attempt $i: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Dev failed to become healthy within 60s"
          exit 1

  # ── E2E test against dev ───────────────────────────────────────────────────
  e2e-test-dev:
    name: E2E Test (Dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run E2E tests against dev
        env:
          LLM_PROVIDER: "bedrock"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_BASE_URL: ${{ secrets.DEV_ALB_URL }}
          ENVIRONMENT: "ci"
          ENABLE_RAG: "false"
        run: python tests/eval_e2e_twilio.py

  # ── Deploy to Prod (manual trigger only) ───────────────────────────────────
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: build
    environment: production  # GitHub environment with required reviewers gate
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS service (prod)
        run: |
          aws ecs update-service \
            --cluster ivr-cluster \
            --service prod-ivr-svc \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for prod service stable
        run: |
          aws ecs wait services-stable \
            --cluster ivr-cluster \
            --services prod-ivr-svc \
            --region ${{ env.AWS_REGION }}

      - name: Health check (prod)
        run: |
          PROD_URL="${{ secrets.PROD_ALB_URL }}"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_URL}/health")
            if [ "$STATUS" = "200" ]; then
              echo "Prod healthy after $((i * 5))s"
              exit 0
            fi
            echo "  attempt $i: status=$STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Prod failed to become healthy within 90s"
          exit 1
